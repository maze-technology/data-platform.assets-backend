logging:
  level:
    root: info
    tech.maze: info
    org.hibernate.SQL: warn
    com.zaxxer.hikari.HikariConfig: warn
    com.zaxxer.hikari: warn
spring:
  main:
    banner-mode: 'off'
  datasource:
    enabled: true
    default:
      configuration:
        maximum-pool-size: 2
        minimum-idle: 2
        max-lifetime: 1800000
        idle-timeout: 30000
        connection-timeout: 20000
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  cache:
    enabled: false
  cloud:
    function:
      definition: syncAssetsRequestConsumer;fetchAssetsResponseConsumer
    stream:
      bindings:
        syncAssetsRequestConsumer-in-0:
          destination: ${ASSETS_SYNC_REQUEST_TOPIC:assets.sync.request}
          group: assets
        fetchAssetsResponseConsumer-in-0:
          destination: ${ASSETS_FETCH_RESPONSE_TOPIC:assets.fetch.response}
          group: assets
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
maze:
  assets-per-page: 50
  events:
    enabled: true
    source: urn:service:assets
  sync:
    fetch-request-topic: ${ASSETS_FETCH_REQUEST_TOPIC:assets.fetch.request}
    fetch-response-topic: ${ASSETS_FETCH_RESPONSE_TOPIC:assets.fetch.response}
